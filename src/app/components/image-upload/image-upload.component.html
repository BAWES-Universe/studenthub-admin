<input style='display:none;' type='file' #fileInput (change)="uploadFileViaHtmlFileInput($event)" [accept]="acceptedFormats"/>
<ion-card (click)="uploadBtnClicked($event)" tappable>
  <ion-spinner *ngIf="isUploading"></ion-spinner>
  <ion-icon [name]="icon" *ngIf="!isUploading && !value"></ion-icon>
  <img [src]="displaySrc()" *ngIf="!isUploading && displaySrc()"/><br/>
  <ion-label>{{ label }}</ion-label>
</ion-card>
